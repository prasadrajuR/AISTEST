
# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
 terraformversion: '1.11.3'
 workingDirectory: '$(System.DefaultWorkingDirectory)/Terraform'

steps:

- task: TerraformInstaller@1
  inputs:
    terraformVersion: '$(terraformversion)'

- task: TerraformTask@5
  inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'Azure-Terraform-connection'
        backendAzureRmResourceGroupName: 'DestinationRG'
        backendAzureRmStorageAccountName: 'prasadrajuterraformstate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Terraform'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)/Terraform'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)/Terraform'
    environmentServiceNameAzureRM: 'Azure-Terraform-connection'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourceDirectory)/Terraform' # Path to the file or folder you want to upload
    artifact: 'drop'                               # Name of the artifact
    publishLocation: 'pipeline'                    # 'pipeline' (Azure DevOps) or 'filepath' (file share)
 
