# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger : none

resources : 
  pipelines:
   - pipeline: ci
     source: 'prasadrajuR.AISTEST'
     trigger:
      branches:
       include:
         - main

pool:
  vmImage: ubuntu-latest


steps:
- download:  ci
  artifact: drop


- script: |
    echo "checking downloaded ci artifacts".
    echo "artifact directory"
    find "$(Pipeline.Workspace)/ci/drop" -type f
  displayName: 'Verify CI Artifacts'

- task: TerraformInstaller@1
  inputs:
    terraformVersion: '1.9.8'

- script : |
    echo "checking download artifact"
    ls -l "$(Pipeline.Workspace)/ci/drop"
    echo "finding terraform files"
    find "$(Pipeline.Workspace)/ci/drop" -name
  displayName: 'verify terraform files'     

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(Pipeline.Workspace)/ci/drop'
    backendServiceArm: 'Azure-Terraform-connection'
    backendAzureRmResourceGroupName: 'DestinationRG'
    backendAzureRmStorageAccountName: 'prasadrajuterraformstate'
    backendAzureRmContainerName: 'tfstate'
    backendAzureRmKey: 'terraform.tfstate'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(Pipeline.Workspace)/ci/drop'
    environmentServiceNameAzureRM: 'Azure-Terraform-connection'
