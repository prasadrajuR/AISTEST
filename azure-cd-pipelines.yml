# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger : none

resources : 
  pipelines:
   - pipeline: ci
     source: 'prasadrajuR.AISTEST'
     trigger:
      branches:
       include:
         - main

pool:
  vmImage: ubuntu-latest


steps:
- download:  ci
  artifact: drop


- script: |
    echo "checking downloaded ci artifacts".
    echo "artifact directory"
    find "$(Pipeline.Workspace)/ci/drop" -type f
  displayName: 'Verify CI Artifacts'

- task: TerraformInstaller@1
  inputs:
    terraformVersion: '1.9.8'

- script : |
    echo "checking download artifact"
    ls -l "$(Pipeline.Workspace)/ci/drop"
    echo "finding terraform files"
    find "$(Pipeline.Workspace)/ci/drop" -type f -name '*.tf'
  displayName: 'verify terraform files'  



- task: AzureCLI@2
  inputs:

    azureSubscription: 'Azure-Terraform-connection'
    addSpnToEnvironment: true
    scriptType: bash
    scriptLocation: inlineScript
    inlinescript: |
      set -e
      export ARM_USE_OIDC=true
      export ARM_USE_AZUREAD=true
      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_OIDC_TOKEN="$idToken"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"   
      echo "checking Terraform Authentication"
      test -n "$ARM_CLIENT_ID"
      test -n "$ARM_OIDC_TOKEN"
      test -n "$ARM_TENANT_ID"
      test -n "$ARM_SUBSCRIPTION_ID"
      echo "cleaning previous Terraform Providers"
      rm -rf .terraform
      echo "Terraform InIt"
      terraform init -reconfigure
      echo "Terraform validate"
      terraform validate
      echo "Terraform Plan"
      terraform plan -out=tfplan
    workingDirectory: '$(Pipeline.Workspace)/ci/drop' 



- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(Pipeline.Workspace)/ci/drop'
    environmentServiceNameAzureRM: 'Azure-Terraform-connection'
